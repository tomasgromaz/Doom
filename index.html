<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Abismo 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout: pantalla 16:10 pixelada arriba, barra de estado abajo; menús como capa sobre la pantalla. */
:root{--bg:#080505;--panel:#1b100c;--edge:#4b2a1b;--ink:#f0e4d0;--dim:#a08870;--blood:#d12a1c;--amber:#f2a531;
--ui:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
#view{position:relative;flex:1;min-height:0;background:#000;touch-action:none}
#screen{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0}
#msg{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:10px;line-height:1.6;color:var(--amber);text-shadow:1px 1px 0 #000;pointer-events:none;padding:0 12px;z-index:4}
#hud{display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,30px);background:linear-gradient(#2b1a12,#150b08);border-top:3px solid var(--edge);padding:6px 10px}
.st{display:flex;flex-direction:column;gap:5px;align-items:center;min-width:0}
.st b{font-weight:400;font-size:clamp(12px,3.4vw,20px);font-variant-numeric:tabular-nums}
.st i{font-style:normal;font-size:7px;color:var(--dim);letter-spacing:.08em}
#face{width:46px;height:46px;image-rendering:pixelated;border:2px solid var(--edge);background:#000;flex:none}
#ov{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px;background:rgba(8,4,3,.84)}
#ov[hidden]{display:none}
#ov h1{margin:0;font-weight:400;font-size:clamp(22px,7vw,52px);color:var(--blood);text-shadow:3px 3px 0 #000,0 0 22px #7a1008;letter-spacing:.04em;text-wrap:balance}
#ov p{margin:0;font-size:clamp(8px,2.2vw,11px);line-height:2;max-width:560px;white-space:pre-line}
.btn{font:inherit;font-size:clamp(11px,3vw,14px);padding:14px 22px;background:var(--blood);color:#fff;border:0;border-bottom:4px solid #6a110a;cursor:pointer}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.tc{display:none}
body.touch .tc{display:block}
#zl,#zr{position:absolute;top:0;bottom:0;z-index:2}
#zl{left:0;width:45%}#zr{right:0;width:55%}
#stick{position:absolute;z-index:3;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(255,255,255,.35);pointer-events:none;display:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.35)}
.tb{position:absolute;z-index:3;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(209,42,28,.55);color:#fff;font:inherit;font-size:9px}
#bFire{right:max(14px,env(safe-area-inset-right,0px));bottom:14px;width:92px;height:92px}
#bSwap{right:max(120px,env(safe-area-inset-right,0px));bottom:20px;width:60px;height:60px;background:rgba(40,40,40,.55);font-size:7px}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="screen"></canvas>
    <div id="flash"></div>
    <div id="msg"></div>
    <div id="zl" class="tc"></div><div id="zr" class="tc"></div>
    <div id="stick"><div id="knob"></div></div>
    <button id="bFire" class="tb tc" type="button">FUEGO</button>
    <button id="bSwap" class="tb tc" type="button">ARMA</button>
    <div id="ov"><h1>ABISMO 3D</h1><p></p><button class="btn" type="button"></button></div>
  </div>
  <div id="hud">
    <div class="st"><b id="hHp">100</b><i>VIDA</i></div>
    <div class="st"><b id="hAr">0</b><i>ARMADURA</i></div>
    <canvas id="face" width="32" height="32"></canvas>
    <div class="st"><b id="hAm">50</b><i id="hWp">PISTOLA</i></div>
    <div class="st"><b id="hKy">-</b><i>LLAVE</i></div>
  </div>
</div>

/* ---------- Audio sintetizado (WebAudio) ---------- */
let AC=null,master=null,nbuf=null,muted=false;

/* ---------- Raycasting (DDA, con puertas deslizantes en el plano medio de la celda) ---------- */
let hitDist=0,hitTex=1,hitU=0,hitSide=0;
function cast(px,py,rdx,rdy){
 let mx=px|0,my=py|0;const ddx=rdx===0?1e30:Math.abs(1/rdx),ddy=rdy===0?1e30:Math.abs(1/rdy);let sx,sy,sdx,sdy,side=0;
 if(rdx<0){sx=-1;sdx=(px-mx)*ddx}else{sx=1;sdx=(mx+1-px)*ddx}
 if(rdy<0){sy=-1;sdy=(py-my)*ddy}else{sy=1;sdy=(my+1-py)*ddy}
 for(let n=0;n<90;n++){
  if(sdx<sdy){sdx+=ddx;mx+=sx;side=0}else{sdy+=ddy;my+=sy;side=1}
  if(mx<0||my<0||mx>=Wd||my>=Ht)break;
  const c=G[my*Wd+mx];if(!c)continue;
  if(c===5||c===7){const dr=doorAt[my*Wd+mx];if(dr.open>=.98)continue;let t,u;
   if(dr.o===0){if(rdy===0)continue;t=(my+.5-py)/rdy;if(t<=0)continue;u=px+rdx*t-mx}
   else{if(rdx===0)continue;t=(mx+.5-px)/rdx;if(t<=0)continue;u=py+rdy*t-my}
   if(u<0||u>=1||u<dr.open)continue;
   hitDist=t;hitTex=c;hitU=u-dr.open;hitSide=side;return t}
  const d=side===0?sdx-ddx:sdy-ddy;let u=side===0?py+d*rdy:px+d*rdx;u-=Math.floor(u);
  if(side===0&&rdx>0)u=1-u;if(side===1&&rdy<0)u=1-u;
  hitDist=d;hitTex=c;hitU=u;hitSide=side;return d}
 hitDist=1e3;hitTex=1;hitU=0;hitSide=side;return 1e3}
const solidAt=(x,y)=>{const i=x|0,j=y|0;if(x<0||y<0||i>=Wd||j>=Ht)return true;const c=G[j*Wd+i];if(!c)return false;if(c===5||c===7)return doorAt[j*Wd+i].open<.7;return true};
const canMove=(x,y,r)=>!(solidAt(x-r,y-r)||solidAt(x+r,y-r)||solidAt(x-r,y+r)||solidAt(x+r,y+r));

   for(let y=ya;y<yb;y++){const c=s.d[(((y-top)/sh*64)|0)*64+u];if((c>>>24)<128)continue;buf[y*W+x]=sc(c,k)}}}

function hitscan(ang,lo,hi,fall){

  const pp=Math.abs(-ex_*ry+ey_*rx);if(pp<(e.t==='B'?.6:e.t==='f'?.42:.3)){best=e;bd=al}}

 else if(P.wpn===2){if(P.bul<=0){sfx('click');P.cool=.3;return}P.bul--;P.cool=.1;P.flash=.05;sfx('pistol');hitscan(P.a+(rnd()-.5)*.06,8,15,false)}

function free(e,x,y){if(!canMove(x,y,.3))return false;for(const o of enemies)if(o!==e&&o.st!=='dead'&&Math.abs(o.x-x)<.55&&Math.abs(o.y-y)<.55)return false;return Math.hypot(P.x-x,P.y-y)>.55}

 if(!m){const px=-ny*e.dir,py=nx*e.dir;if(free(e,e.x+px,e.y+py)){e.x+=px;e.y+=py}else if(rnd()<.05)e.dir=-e.dir}}
function updE(e,dt){

 if(e.st==='atk'){e.tm-=dt;if(e.tm<=0){attack(e,dist,dx,dy);e.st='walk';e.cd=d.cd*(.7+rnd()*.6)}return}

const keys={},mv={f:0,s:0};let look=0,mouseDown=false,touchFire=false;
function update(dt){
 T+=dt;P.cool=Math.max(0,P.cool-dt);P.flash=Math.max(0,P.flash-dt);P.hurtT=Math.max(0,P.hurtT-dt);
 const fa=$('flash');if(flashScr.a>0){flashScr.a=Math.max(0,flashScr.a-dt*1.6);fa.style.opacity=flashScr.a}
 if(state!=='play')return;
 if(keys.ArrowLeft||keys.KeyQ)P.a-=2.4*dt;if(keys.ArrowRight||keys.KeyE)P.a+=2.4*dt;P.a+=look;look=0;
 let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)+mv.f,s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+mv.s;
 const ln=Math.hypot(f,s);if(ln>1){f/=ln;s/=ln}
 const spd=(keys.ShiftLeft||keys.ShiftRight)?4.6:3.3,dx=Math.cos(P.a),dy=Math.sin(P.a);
 const vx=(dx*f-dy*s)*spd*dt,vy=(dy*f+dx*s)*spd*dt;
 if(canMove(P.x+vx,P.y,.25))P.x+=vx;if(canMove(P.x,P.y+vy,.25))P.y+=vy;
 if(ln>.05)P.bob+=dt*9*(spd/3.3);
 if(keys.Space||keys.ControlLeft||mouseDown||touchFire)fire();
 for(const dr of doorList){
  const cx=dr.x+.5,cy=dr.y+.5,dp=Math.hypot(P.x-cx,P.y-cy);let want=false;
  if(dp<1.7){if(dr.type===7&&!P.key){if(!dr.warned){msg('Puerta cerrada: falta la llave roja');dr.warned=true}}else want=true}else dr.warned=false;
  if(!want&&dr.type===5)for(const e of enemies)if(e.st!=='dead'&&e.awake&&Math.hypot(e.x-cx,e.y-cy)<1.3){want=true;break}
  if(want)dr.hold=2.5;else dr.hold-=dt;
  const occ=dp<.8||enemies.some(e=>e.st!=='dead'&&Math.hypot(e.x-cx,e.y-cy)<.8);
  if(want||occ||dr.hold>0){if(dr.open<1){if(dr.open===0)sfx('door');dr.open=Math.min(1,dr.open+dt*1.6)}}else if(dr.open>0)dr.open=Math.max(0,dr.open-dt*1.2)}
 for(const e of enemies)updE(e,dt);
 for(let i=balls.length-1;i>=0;i--){const b=balls[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  if(b.life<=0||solidAt(b.x,b.y)){balls.splice(i,1);continue}
  if(Math.hypot(P.x-b.x,P.y-b.y)<.45){hurtP(9+rnd()*9);balls.splice(i,1)}}
 for(const it of items){if(it.got||Math.hypot(P.x-it.x,P.y-it.y)>.6)continue;let ok=true,m='';
  switch(it.t){
   case'h':if(P.hp>=100)ok=false;else{P.hp=Math.min(100,P.hp+25);m='+25 vida'}break;
   case'a':if(P.bul>=200)ok=false;else{P.bul=Math.min(200,P.bul+14);m='+14 balas'}break;
   case's':if(P.sh>=50)ok=false;else{P.sh=Math.min(50,P.sh+5);m='+5 cartuchos'}break;
   case'A':if(P.ar>=100)ok=false;else{P.ar=Math.min(100,P.ar+30);m='+30 armadura'}break;
   case'S':P.hasSh=true;P.sh=Math.min(50,P.sh+8);P.wpn=1;m='Escopeta (tecla 2)';break;
   case'C':P.hasCg=true;P.bul=Math.min(200,P.bul+40);P.wpn=2;m='Ametralladora (tecla 3)';break;
   case'k':P.key=true;m='Llave roja';break}
  if(ok){it.got=true;found++;msg(m);sfx('pickup');flashScr('#fc4',.25)}}
 if(Math.hypot(P.x-(ex+.5),P.y-(ey+.5))<1.15)levelDone()}
function levelDone(){
 if(enemies.some(e=>e.t==='B'&&e.st!=='dead')){if(!levelDone.w){levelDone.w=1;msg('Derrotá al Guardián para abrir la salida');setTimeout(()=>levelDone.w=0,2500)}return}
 sfx('win');
 const stats=`Enemigos: ${kills}/${total}\nObjetos: ${found}/${itemTotal}`;P0={...P};
 if(cur+1<LV.length){state='over';showOv('NIVEL COMPLETO',stats,'Siguiente nivel',()=>{P0={...P,key:false};loadLevel(cur+1);start()})}
 else{state='over';showOv('FIN DEL ABISMO','Derrotaste al Guardián y cerraste la grieta.\n'+stats,'Jugar de nuevo',()=>{resetP();loadLevel(0);start()})}}

/* ---------- HUD ---------- */
const fc=$('face').getContext('2d'),hc={};let faceLook=0,faceT=0;
function setT(id,v){if(hc[id]!==v){hc[id]=v;$(id).textContent=v}}
function drawFace(){
 const g=fc,hp=P.hp,dead=hp<=0,sk=hp>60?'#dcab80':hp>30?'#c98f6b':'#b5755a',hurt=P.hurtT>0,sh=P.flash>0;
 R(g,'#1a0f0c',0,0,32,32);R(g,sk,6,6,20,22);R(g,'#3a281c',5,3,22,6);R(g,'#3a281c',5,3,3,12);R(g,'#3a281c',24,3,3,12);R(g,sk,4,14,2,6);R(g,sk,26,14,2,6);
 if(dead){R(g,'#1a1a1a',9,13,5,2);R(g,'#1a1a1a',18,13,5,2);R(g,'#1a1a1a',11,12,1,4);R(g,'#1a1a1a',20,12,1,4)}
 else{R(g,'#f4efe6',9,13,5,3);R(g,'#f4efe6',18,13,5,3);R(g,'#16100c',10+faceLook,13,2,3);R(g,'#16100c',19+faceLook,13,2,3);
  const by=hurt||sh?10:11;R(g,'#2a1a10',8,by,7,2);R(g,'#2a1a10',17,by,7,2)}
 R(g,'rgba(0,0,0,.18)',15,16,3,5);
 if(dead)R(g,'#5a1a1a',11,22,10,4);else if(hurt)R(g,'#5a1a1a',12,22,8,4);else if(sh){R(g,'#5a1a1a',11,22,10,3);R(g,'#f4efe6',12,22,8,1)}else R(g,'#7a3a2e',12,23,8,2);
 if(hp<50){R(g,'#9c1414',7,8,3,9);R(g,'#9c1414',22,18,4,3)}if(hp<25){R(g,'#9c1414',20,7,5,6);R(g,'#9c1414',9,22,3,5)}}
function hud(dt){
 setT('hHp',P.hp|0);setT('hAr',P.ar|0);setT('hAm',P.wpn===1?P.sh:P.bul);setT('hWp',['PISTOLA','ESCOPETA','AMETRALLADORA'][P.wpn]);setT('hKy',P.key?'ROJA':'-');
 faceT-=dt;if(faceT<=0){faceT=.9+rnd();faceLook=(rnd()*3|0)-1}drawFace()}

/* ---------- Menús y entrada ---------- */
const ov=$('ov'),ovh=ov.querySelector('h1'),ovp=ov.querySelector('p'),ovb=ov.querySelector('button');let ovCb=null;
function showOv(h,p,b,cb){ovh.textContent=h;ovp.textContent=p;ovb.textContent=b;ovCb=cb;ov.hidden=false;try{if(document.pointerLockElement)document.exitPointerLock()}catch(e){}}
ovb.addEventListener('click',()=>{initAudio();musicOn();const cb=ovCb;ov.hidden=true;if(cb)cb()});
function start(){state='play';ov.hidden=true;flashScr('#000',0);msg('Nivel '+(cur+1)+': '+L.name)}
function resetP(){Object.assign(P,{hp:100,ar:0,bul:50,sh:0,hasSh:false,hasCg:false,key:false,wpn:0});P0={...P}}
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;if(isTouch)document.body.classList.add('touch');
function menu(){state='menu';showOv('ABISMO 3D',isTouch?'Pad izquierdo: moverse. Pad derecho: mirar.\nFUEGO dispara, ARMA cambia de arma.\nLas puertas se abren solas al acercarte.':'WASD: moverse   Mouse o flechas: mirar\nClick o ESPACIO: disparar   1, 2 y 3: armas\nShift: correr   M: sonido\nLas puertas se abren solas al acercarte.','Jugar',()=>{resetP();loadLevel(0);start()})}
addEventListener('keydown',e=>{keys[e.code]=true;
 if(e.code==='Digit1')setWpn(0);if(e.code==='Digit2')setWpn(1);if(e.code==='Digit3')setWpn(2);if(e.code==='KeyM'){muted=!muted;msg(muted?'Sonido apagado':'Sonido activado')}
 if(e.code==='KeyP'||e.code==='Escape')pause();
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});
function pause(){if(state!=='play')return;state='pause';showOv('PAUSA','','Continuar',()=>{state='play'})}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
cv.addEventListener('mousedown',e=>{if(state!=='play')return;initAudio();mouseDown=true;try{if(!document.pointerLockElement&&cv.requestPointerLock){const r=cv.requestPointerLock();if(r&&r.catch)r.catch(()=>{})}}catch(_){}});
addEventListener('mouseup',()=>{mouseDown=false});
addEventListener('mousemove',e=>{if(state==='play'&&(document.pointerLockElement===cv||mouseDown))P.a+=e.movementX*.003});
cv.addEventListener('contextmenu',e=>e.preventDefault());
// táctil
let tm=null,tl=null;const stick=$('stick'),knob=$('knob');
$('zl').addEventListener('touchstart',e=>{e.preventDefault();initAudio();const t=e.changedTouches[0];tm={id:t.identifier,x:t.clientX,y:t.clientY};
 const r=$('view').getBoundingClientRect();stick.style.display='block';stick.style.left=(t.clientX-r.left)+'px';stick.style.top=(t.clientY-r.top)+'px';knob.style.transform='none'},{passive:false});
$('zl').addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(tm&&t.identifier===tm.id){const dx=clamp((t.clientX-tm.x)/50,-1,1),dy=clamp((t.clientY-tm.y)/50,-1,1);mv.s=dx;mv.f=-dy;knob.style.transform=`translate(${dx*30}px,${dy*30}px)`}},{passive:false});
const endM=e=>{for(const t of e.changedTouches)if(tm&&t.identifier===tm.id){tm=null;mv.f=mv.s=0;stick.style.display='none'}};
$('zl').addEventListener('touchend',endM);$('zl').addEventListener('touchcancel',endM);
$('zr').addEventListener('touchstart',e=>{e.preventDefault();initAudio();const t=e.changedTouches[0];tl={id:t.identifier,x:t.clientX}},{passive:false});
$('zr').addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(tl&&t.identifier===tl.id){look+=(t.clientX-tl.x)*.007;tl.x=t.clientX}},{passive:false});
const endL=e=>{for(const t of e.changedTouches)if(tl&&t.identifier===tl.id)tl=null};
$('zr').addEventListener('touchend',endL);$('zr').addEventListener('touchcancel',endL);
$('bFire').addEventListener('touchstart',e=>{e.preventDefault();touchFire=true},{passive:false});
$('bFire').addEventListener('touchend',()=>{touchFire=false});$('bFire').addEventListener('touchcancel',()=>{touchFire=false});
$('bSwap').addEventListener('touchstart',e=>{e.preventDefault();const ws=[0,1,2].filter(n=>n===0||(n===1&&P.hasSh)||(n===2&&P.hasCg));setWpn(ws[(ws.indexOf(P.wpn)+1)%ws.length])},{passive:false});

/* ---------- Bucle principal ---------- */
let last=0;
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000||0);last=t;
 if(state==='menu')P.a+=dt*.25;
 update(dt);render();hud(dt)}
function validate(){const bad=[];
 for(let n=0;n<LV.length;n++){loadLevel(n);const seen=new Uint8Array(Wd*Ht),q=[[P.x|0,P.y|0]];seen[(P.y|0)*Wd+(P.x|0)]=1;
  while(q.length){const[x,y]=q.pop();for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const i=x+a,j=y+b;if(i<0||j<0||i>=Wd||j>=Ht)continue;const c=G[j*Wd+i];if(seen[j*Wd+i]||(c!==0&&c!==5&&c!==7))continue;seen[j*Wd+i]=1;q.push([i,j])}}
  const ok=(x,y)=>seen[(y|0)*Wd+(x|0)]===1;
  if(!ok(ex-1,ey)&&!ok(ex,ey-1)&&!ok(ex,ey+1)&&!ok(ex+1,ey))bad.push(`nivel ${n+1}: salida inalcanzable`);
  for(const e of enemies)if(!ok(e.x,e.y))bad.push(`nivel ${n+1}: enemigo ${e.t} fuera de zona (${e.x|0},${e.y|0})`);
  for(const it of items)if(!ok(it.x,it.y))bad.push(`nivel ${n+1}: objeto ${it.t} fuera de zona (${it.x|0},${it.y|0})`);
  const kk=L.doors.find(d=>d[2]===7);if(kk){const key=items.find(i=>i.t==='k');if(!key)bad.push('nivel '+(n+1)+': hay puerta roja pero no llave')}}
 return bad}
window.__g={update,render,validate,loadLevel,P,start,get state(){return state},get enemies(){return enemies},get kills(){return kills},keys,fire,setWpn,get G(){return G},get dims(){return[Wd,Ht]}};
resetP();loadLevel(0);menu();requestAnimationFrame(frame);
})();
</script>
